<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f7f7fb"/><rect x="22" y="22" width="1156" height="676" rx="18" fill="#fff" stroke="#d8dbe8"/><rect x="22" y="22" width="1156" height="64" rx="18" fill="#2b2d42"/><text x="52" y="61" font-family="Arial" font-size="24" fill="#fff" font-weight="700">Paper Code Evidence Reader · Source Evidence</text><text x="50" y="124" font-family="Arial" font-size="15" fill="#344054">PDF 2 / 44</text><rect x="160" y="101" width="126" height="34" rx="8" fill="#eef2ff"/><text x="180" y="123" font-family="Arial" font-size="13" fill="#4338ca">Selected region</text><rect x="296" y="101" width="96" height="34" rx="8" fill="#fff" stroke="#d8dbe8"/><text x="316" y="123" font-family="Arial" font-size="13" fill="#667085">Full page</text><rect x="404" y="101" width="112" height="34" rx="8" fill="#fff" stroke="#d8dbe8"/><text x="424" y="123" font-family="Arial" font-size="13" fill="#667085">Show locator</text><rect x="48" y="154" width="530" height="504" rx="12" fill="#f2f2f2" stroke="#d8dbe8"/><rect x="92" y="184" width="442" height="438" rx="4" fill="#fff" stroke="#cfd3dc"/><text x="118" y="220" font-family="Georgia" font-size="17" fill="#111827" font-weight="700">3.1 Learnable Activation Steering</text><text x="118" y="258" font-family="Georgia" font-size="13" fill="#374151">We formulate activation steering as a learnable process...</text><text x="118" y="286" font-family="Georgia" font-size="13" fill="#374151">h' ← h + λ Δh</text><text x="118" y="322" font-family="Georgia" font-size="13" fill="#374151">The transformation should preserve utility on benign inputs</text><text x="118" y="346" font-family="Georgia" font-size="13" fill="#374151">while strengthening refusal behavior on malicious inputs.</text><rect x="108" y="242" width="402" height="126" fill="none" stroke="#4f46e5" stroke-width="3"/><text x="118" y="408" font-family="Arial" font-size="12" fill="#667085">Original PDF pixels are preserved in the real reader.</text><rect x="602" y="154" width="552" height="504" rx="12" fill="#fff" stroke="#d8dbe8"/><text x="628" y="190" font-family="Arial" font-size="19" fill="#2b2d42" font-weight="700">简体中文 · selected-region translation</text><text x="628" y="230" font-family="Arial" font-size="14" fill="#344054">我们将激活引导表述为一个可学习过程……</text><text x="628" y="260" font-family="Arial" font-size="14" fill="#344054">h' ← h + λ Δh</text><text x="628" y="300" font-family="Arial" font-size="14" fill="#344054">该变换需要在良性输入上尽量保持模型效用，</text><text x="628" y="328" font-family="Arial" font-size="14" fill="#344054">同时在恶意输入上增强拒绝行为。</text><line x1="628" y1="362" x2="1124" y2="362" stroke="#e5e7eb"/><text x="628" y="400" font-family="Arial" font-size="16" fill="#2b2d42" font-weight="700">How to use this panel</text><text x="628" y="434" font-family="Arial" font-size="13" fill="#667085">1. Read the original crop first.</text><text x="628" y="462" font-family="Arial" font-size="13" fill="#667085">2. Check the selected-language translation or source transcript.</text><text x="628" y="490" font-family="Arial" font-size="13" fill="#667085">3. Switch to Full page when surrounding context matters.</text><text x="628" y="518" font-family="Arial" font-size="13" fill="#667085">4. Use Show locator to see where the crop sits on the page.</text><text x="628" y="558" font-family="Arial" font-size="12" fill="#9ca3af">Translation is limited to the selected region, not the whole paper.</text></svg>