<header><div class="brand"><div class="logo">&lt;/&gt;</div><div><div class="kicker">CODE + AUTHOR ARGUMENT</div><h1 id="projectTitle"></h1></div></div><div class="headbuttons"><div class="headmeta" id="headmeta"></div><button class="btn mobiletoggle" id="menubtn" data-ui="menu"></button><button class="btn optional" id="guidebtn" data-ui="route"></button><button class="btn" id="aboutbtn" data-ui="about"></button></div></header>

<main class="work" id="work"><div class="crumb" id="crumb"></div><div class="lessonkind" id="lessonkind"></div><div class="titleline"><h2 id="title"></h2><span class="lessonpos" id="lessonpos"></span></div><p class="intro" id="intro"></p><div class="workspace"><section class="center"><div class="stagebar" id="stages"></div><div id="codePanel"></div><div class="hint" data-ui="numbering"></div><div class="card flowcard"><div class="flowtitle" data-ui="flow"></div><div class="flow" id="flow"></div><div class="inout"><div><small data-ui="before"></small><p id="before"></p></div><div><small data-ui="after"></small><p id="after"></p></div></div></div><div class="pager"><button class="btn" id="prev"></button><button class="btn primary" id="next"></button></div><div class="fineprint" id="provenance"></div></section><aside class="aside"><div class="tabs" role="tablist"><button class="active" data-tab="vars" role="tab" data-ui="variables"></button><button data-tab="example" role="tab" data-ui="example"></button><button data-tab="paper" role="tab" data-ui="paper"></button></div><div class="card"><div class="sidebody" id="sidebody" role="tabpanel" aria-live="polite"></div></div><div class="caution" id="caution"></div><div class="sidecallout" data-ui="readinghint"></div></aside></div></main></div>
<dialog id="about"><button class="btn close" data-close="about" data-ui="close"></button><h3 data-ui="principle"></h3><p data-ui="aboutText"></p><p id="counts"></p><p data-ui="notDebugger"></p><p data-ui="numbering"></p><button class="btn primary" id="journeybtn" data-ui="route"></button></dialog>

<script>
'use strict';
const D=JSON.parse(document.getElementById('readerdata').textContent), U=D.ui, $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeURL=s=>{try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:''}catch{return ''}};
const link=(url,text)=>safeURL(url)?`<a class="sourceurl" href="${esc(safeURL(url))}" target="_blank" rel="noopener noreferrer">${esc(text)} &#8599;</a>`:'';
let current=D.lessons.findIndex(x=>x.id===(location.hash.slice(1)||D.default_lesson));if(current<0)current=0;
let stage=0,tab='vars',demoStep=0,all=false;
document.documentElement.lang=D.language||'zh-CN';document.title=D.title;
document.querySelectorAll('[data-ui]').forEach(el=>el.textContent=U[el.dataset.ui]||el.dataset.ui);
$('projectTitle').textContent=D.title;$('scope').textContent=D.scope;
$('search').placeholder=U.search;$('search').setAttribute('aria-label',U.search);
$('headmeta').innerHTML=`<code>${esc(D.repository?.commit?.slice(0,12)||U.unpinned)}</code><br>${esc(D.evidence_level)}`;
$('provenance').textContent=[D.repository?.url||'',D.repository?.commit||U.unpinned,D.paper?.title||'',D.paper?.version||'',D.evidence_level,D.scope].filter(Boolean).join(' | ');
function colorize(s){const re=/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:if|else|elif|return|for|in|def|class|from|import|as|with|True|False|None|try|except|not|and|or)\b|\b\d+\b)/g;let out='',end=0,m;while((m=re.exec(s))!==null){out+=esc(s.slice(end,m.index));const x=m[0],cl=/^["']/.test(x)?'str':/^\d/.test(x)?'numlit':'kw';out+=`<span class="${cl}">${esc(x)}</span>`;end=m.index+x.length}return out+esc(s.slice(end))}
function renderTree(){const q=$('search').value.trim().toLowerCase(),groups=new Map();D.lessons.forEach((l,i)=>{if(q&&!JSON.stringify(l).toLowerCase().includes(q))return;if(!groups.has(l.file))groups.set(l.file,[]);groups.get(l.file).push([l,i])});let h='';for(const [file,items]of groups){h+=`<div class="treegroup">${esc(file)}</div>`;for(const [l,i]of items)h+=`<button class="navitem symbol ${i===current?'active':''}" data-lesson="${i}" ${i===current?'aria-current="page"':''}><span class="num">${String(i+1).padStart(2,'0')}</span><span><span class="name">${esc(l.symbol||l.title)}</span><span class="desc">${esc(l.title)}</span></span></button>`}$('tree').innerHTML=h||`<div class="emptysearch">${esc(U.noSearch)}</div>`}
function cardHtml(b,idx){return `<article class="card" data-block="${idx}"><div class="cardhead"><div><h3>${esc(b.title)}</h3><div class="sourcepath">${esc(b.path)}${b.symbol?' / '+esc(b.symbol):''}</div><div class="source-kind">${esc(U.kinds[b.source_kind]||b.source_kind)}</div></div>${link(b.url,U.source)}</div><div class="blocklead">${esc(b.summary)}</div><div class="readinglabel"><span>${esc(U.code)}</span><span>${esc(U.explanation)}</span></div>${b.rows.map((r,i)=>{const lines=r.start_line?`L${r.start_line}${r.end_line!==r.start_line?'-'+r.end_line:''}`:String(i+1).padStart(2,'0');return `<div class="coderow"><div class="srccell"><span class="statementnum" title="${esc(r.start_line?U.realLines:U.studyNumber)}">${esc(lines)}</span><pre><code>${colorize(r.code)}</code></pre></div><div class="notecell"><p class="meaning">${esc(r.meaning)}</p><div class="why"><b>${esc(U.why)} </b>${esc(r.why)}</div><div class="effect"><b>${esc(U.result)}</b>${esc(r.result)}</div></div></div>`}).join('')}${b.note?`<div class="blocknote">${esc(b.note)}</div>`:''}</article>`}
function renderCode(){const l=D.lessons[current];$('stages').innerHTML=l.blocks.map((b,i)=>`<button class="stagebutton ${!all&&stage===i?'active':''}" data-stage="${i}">${esc(b.title)}</button>`).join('')+(l.blocks.length>1?`<button class="stagebutton ${all?'active':''}" data-all="true">${esc(U.all)}</button>`:'');$('codePanel').className=all?'allblocks':'';$('codePanel').innerHTML=all?l.blocks.map(cardHtml).join(''):cardHtml(l.blocks[stage],stage)}
function paperHtml(l){let h=`<div class="sidetitle">${esc(U.paperHeading)}</div>`;if(!l.papers?.length)return h+`<div class="none">${esc(U.noPaper)}</div>`;for(const idx of l.papers){const p=D.paperPoints[idx],size=D.sizes?.[String(p.page)],img=D.images?.[String(p.page)];h+=`<section class="paperitem"><small>PDF ${esc(U.page)} ${p.page}</small><h4>${esc(p.section)}</h4><span class="paperstatus">${esc(U.statuses[p.status]||p.status)}</span><p>${esc(p.paperSummary)}</p><p><b>${esc(U.relation)} </b>${esc(p.relation)}</p>`;if(p.quote)h+=`<p>${esc(p.quote)}</p>`;if(img&&size){const c=p.clip||[0,0,...size],r=p.rect;h+=`<div class="paperclip"><svg viewBox="${c[0]} ${c[1]} ${c[2]-c[0]} ${c[3]-c[1]}" role="img" aria-label="${esc(U.paperImage)}"><image width="${size[0]}" height="${size[1]}" href="${esc(img)}"/>${r?`<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="#e0a93e" fill-opacity=".12" stroke="#bd8b2b" stroke-width=".8"/>`:''}</svg></div>`}h+=link(p.paperUrl,U.paperSource)+'</section>'}return h}
function exampleHtml(l){const e=l.example;let h=`<div class="sidetitle">${esc(U.example)}</div>`;if(!e)return h+`<div class="none">${esc(U.noExample)}</div>`;if(typeof e==='string')h+=`<div class="exampletext">${esc(e)}</div>`;else{const step=e.steps[demoStep%e.steps.length];h+=`<div class="demo"><div class="demolabel">${demoStep+1} / ${e.steps.length} / ${esc(step.title)}</div><div class="demobox">${esc(step.state)}</div>${step.explanation?`<p>${esc(step.explanation)}</p>`:''}<button class="btn primary" data-step="next">${esc(demoStep===e.steps.length-1?U.restart:U.nextStep)}</button></div>`}return h+`<div class="demofine">${esc(U.toyNotice)}</div>`}
